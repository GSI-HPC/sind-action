name: 'Setup sind'
description: 'Install sind and create Slurm-in-Docker clusters for CI testing'
branding:
  icon: 'server'
  color: 'blue'

inputs:
  version:
    description: 'sind version to install (e.g., v0.9.0; minimum v0.8.0), or "latest"'
    required: false
    default: 'latest'
  verify:
    description: |
      Verify the build provenance attestation of the sind binary (sind v0.10.0
      and later) with the GitHub CLI (gh). Set to "false" on runners without
      gh; the binary's checksum is checked either way.
    required: false
    default: 'true'
  token:
    description: 'GitHub token for gh to read the attestations of the public sind repository'
    required: false
    default: ${{ github.token }}
  clusters:
    description: |
      YAML list of cluster definitions. Each entry is either a path to a sind
      cluster config file, or an inline sind cluster config.
      Example:
        clusters: |
          - cluster.yml
          - kind: Cluster
            name: dev
            nodes:
              - controller
              - worker: 2
    required: false
    default: ''
  pull:
    description: 'Pull container images before creating clusters'
    required: false
    default: 'true'
  wait:
    description: |
      How long `sind create cluster` waits for the nodes and Slurm, e.g. "10m",
      or "0" for no limit; image pulls don't count. Empty uses sind's default.
      Needs a sind release after v0.10.0; older ones ignore it with a warning.
    required: false
    default: ''
  realm:
    description: 'sind realm for resource isolation (useful for parallel jobs); a DNS label: lowercase letters, digits and "-"'
    required: false
    default: ''

outputs:
  clusters:
    description: 'Comma-separated list of created cluster names'
    value: ${{ steps.create.outputs.clusters }}
  version:
    description: 'Installed sind version'
    value: ${{ steps.install.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Install sind
      id: install
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/install.sh"
      env:
        SIND_VERSION: ${{ inputs.version }}
        SIND_VERIFY: ${{ inputs.verify }}
        GH_TOKEN: ${{ inputs.token }}

    - name: Set verbosity
      shell: bash
      run: |
        if [[ "${RUNNER_DEBUG:-0}" == "1" ]]; then
          echo "SIND_VERBOSITY=-vvv" >> "$GITHUB_ENV"
        else
          echo "SIND_VERBOSITY=-v" >> "$GITHUB_ENV"
        fi

    - name: Check prerequisites
      shell: bash
      run: sind $SIND_VERBOSITY doctor

    - name: Set realm
      if: ${{ inputs.realm != '' }}
      shell: bash
      run: |
        if [[ "$REALM" =~ [[:cntrl:]] ]]; then
          echo "::error::realm must not contain control characters such as newlines"
          exit 1
        fi
        echo "SIND_REALM=${REALM}" >> "$GITHUB_ENV"
      env:
        REALM: ${{ inputs.realm }}

    - name: Create clusters
      id: create
      if: ${{ inputs.clusters != '' }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/create.sh"
      env:
        SIND_CLUSTERS: ${{ inputs.clusters }}
        SIND_PULL: ${{ inputs.pull }}
        SIND_WAIT: ${{ inputs.wait }}
