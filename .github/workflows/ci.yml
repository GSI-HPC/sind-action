name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: actionlint
        uses: rhysd/actionlint@v1.7.12

  e2e:
    name: e2e (sind ${{ matrix.version }}${{ matrix.runner != 'ubuntu-latest' && format(', {0}', matrix.runner) || '' }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported sind release and the newest one.
        version: [v0.8.0, latest]
        runner: [ubuntu-latest]
        include:
          # The newest release on ARM64, which needs sind v0.10.0 or later.
          - version: latest
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Setup sind
        id: sind
        uses: ./
        with:
          version: ${{ matrix.version }}
          realm: e2e
          clusters: |
            - .github/e2e/cluster.yml
            - kind: Cluster
              name: inline
              nodes:
                - controller
                - worker: 1

      - name: Check outputs
        env:
          CLUSTERS: ${{ steps.sind.outputs.clusters }}
          VERSION: ${{ steps.sind.outputs.version }}
        run: |
          [[ "$CLUSTERS" == "file,inline" ]]
          [[ "$VERSION" == v* ]]

      - name: Run Slurm jobs
        run: |
          sind exec file -- sinfo
          sind exec file -- srun -N2 hostname
          sind exec inline -- srun hostname

      - name: Cleanup
        if: always()
        uses: ./cleanup

      - name: Check cleanup
        run: |
          sind get clusters
          [[ -z "$(sind get clusters | tail -n +2)" ]]
