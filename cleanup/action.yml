name: 'sind cleanup'
description: 'Delete all sind clusters'

runs:
  using: 'composite'
  steps:
    - name: Delete clusters
      if: always()
      shell: bash
      run: |
        if ! sind $SIND_VERBOSITY delete cluster --all 2>&1; then
          echo "::warning::sind delete cluster --all failed, some clusters may be left behind"
        fi
